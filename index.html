<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191f"><meta name="description" content="Bridge Lite — editor leve para addons Minecraft Bedrock.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>Bridge Lite</title><link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="Abrir arquivos">☰</button>
  <div class="brand"><span class="brandmark">B</span><span>bridge <b>lite</b></span></div>
  <div class="projectname" id="projectName">Projeto sem nome</div>
  <div class="top-actions">
    <button id="openBtn" class="btn subtle">Abrir</button><button id="saveBtn" class="btn subtle">Salvar</button>
    <button id="exportBtn" class="btn primary">Exportar ZIP</button>
    <input id="fileInput" type="file" multiple hidden>
    <input id="folderInput" type="file" webkitdirectory multiple hidden>
  </div>
</header>
<div class="workspace">
 <aside class="sidebar" id="sidebar">
  <div class="sidehead"><span>EXPLORADOR</span><div><button id="newFileBtn" title="Novo arquivo">＋</button><button id="newFolderBtn" title="Nova pasta">▱</button></div></div>
  <div id="fileTree" class="filetree"></div>
  <div class="sidefoot"><span class="dot"></span> Armazenamento local</div>
 </aside>
 <main class="main">
  <div class="tabs" id="tabs"><div class="emptytab">Nenhum arquivo aberto</div></div>
  <section class="editor-wrap">
   <div class="welcome" id="welcome">
    <div class="welcome-logo">B</div><h1>Bridge <span>Lite</span></h1>
    <p>Um espaço leve para criar addons do Minecraft Bedrock.</p>
    <div class="welcome-actions"><button class="btn primary" id="createProjectBtn">＋ Criar arquivo</button><button class="btn subtle" id="importWelcomeBtn">Importar projeto</button></div>
    <div class="quickgrid"><div><b>JSON</b><small>Behavior e Resource Packs</small></div><div><b>JavaScript</b><small>Script API</small></div><div><b>MCFunction</b><small>Comandos e funções</small></div></div>
   </div>
   <div id="editorPanel" class="editor-panel" hidden>
    <div class="editor-toolbar"><span id="filePath"></span><span id="fileStatus">Salvo</span><button id="formatBtn" class="mini">Formatar JSON</button></div>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Editor de código"></textarea>
    <div class="statusbar"><span id="languageLabel">TEXTO</span><span id="cursorLabel">Ln 1, Col 1</span><span id="validation">Pronto</span></div>
   </div>
  </section>
 </main>
</div>
<div id="toast" role="status"></div>
<dialog id="nameDialog"><form method="dialog"><h3 id="dialogTitle">Novo arquivo</h3><label for="nameInput">Nome</label><input id="nameInput" placeholder="ex: manifest.json" required><div class="dialog-actions"><button class="btn subtle" value="cancel">Cancelar</button><button id="confirmName" class="btn primary" value="ok">Criar</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="./app.js"></script>
</body></html>
